[project]
name = "ngan-quality-check"
version = "0.1.0"
description = "Portable Day 10 quality and freshness exercise"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "great-expectations==1.18.0",
  "pandas==3.0.3",
  "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
